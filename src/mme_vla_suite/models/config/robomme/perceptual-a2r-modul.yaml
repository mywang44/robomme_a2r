budget: 512
num_views: 1
token_per_image: 64
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: a2r
  cand_frames: 16          # 16 x 64 = 1024 候选，budget 512 -> 2:1
  attn_layer: 17           # relevance 取第几层的 action->memory 注意力
  nov_share: 0.5           # novelty 占名额的比例；设 1.0 = 只用 novelty（对照组）